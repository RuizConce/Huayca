<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huayca — Mi organización</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/huayca.css">
</head>
<body>

<div class="anuncio-bar">
  <div class="container">
    <span id="franjaIzq">💚 Cada compra fortalece una organización y mejora la vida de más personas.</span>
    <span class="der" id="franjaDer">Juntos hacemos comunidad</span>
  </div>
</div>

<header class="site">
  <div class="nav-principal">
    <a href="index.html" class="logo">
      <div class="logo-mark">H</div>
      <div class="logo-texto"><b>Huayca</b><span>CONECTAMOS COMUNIDADES</span></div>
    </a>
    <div class="nav-acciones" style="margin-left:auto;">
      <span class="nav-accion" id="nombreOrgHeader"></span>
      <button class="btn btn-sm btn-outline" id="btnLogout">Cerrar sesión</button>
    </div>
  </div>
</header>

<main>
  <div class="container dash-header">
    <h1 id="tituloDash">Mi organización</h1>
  </div>

  <div id="vistaDash" class="container">
    <div class="estado-vacio">Cargando dashboard…</div>
  </div>
</main>

<footer class="site">
  <div class="container footer-bottom" style="border-top:1px solid rgba(255,255,255,0.1); margin-top:30px;">
    <span>© 2026 Huayca. Todos los derechos reservados.</span>
    <span class="firma">Juntos hacemos comunidad.</span>
  </div>
</footer>

<script src="js/huayca.js"></script>
<script>
const ESTADO_LABEL = {
  pendiente: 'Pendiente', solicitada: 'Solicitada', aprobada: 'Aprobada', pagada: 'Pagada', anulada: 'Anulada'
};

function irALogin() {
  Huayca.cerrarSesionOrg();
  window.location.href = 'organizacion-login.html';
}

async function cargarDashboard() {
  if (!Huayca.getTokenOrg()) { irALogin(); return; }

  const sesion = Huayca.getSesionOrg();
  document.getElementById('tituloDash').textContent = sesion?.nombre || 'Mi organización';
  document.getElementById('nombreOrgHeader').textContent = '👋 ' + (sesion?.nombre || '');

  const cont = document.getElementById('vistaDash');
  try {
    const [data, catalogo] = await Promise.all([
      Huayca.apiFetch('/api/organizaciones/mi-dashboard', {
        headers: { Authorization: 'Bearer ' + Huayca.getTokenOrg() }
      }),
      // El catálogo-con-comisiones es informativo (para decidir qué
      // promocionar) y no debería tumbar el dashboard si falla — se cae a
      // un array vacío en vez de dejar sin cargar el resto de la página.
      Huayca.apiFetch('/api/organizaciones/catalogo-comisiones', {
        headers: { Authorization: 'Bearer ' + Huayca.getTokenOrg() }
      }).catch(() => [])
    ]);

    const link = `${Huayca.BASE_URL}/catalogo.html?org=${encodeURIComponent(sesion?.slug || '')}`;
    const filas = (data.ultimas_comisiones || []).map((c) => `
      <tr>
        <td>${c.pedido_codigo}</td>
        <td>${Huayca.formatoCLP(c.monto)}</td>
        <td><span class="estado-pill ${c.estado}">${ESTADO_LABEL[c.estado] || c.estado}</span></td>
        <td>${Huayca.formatoFecha(c.created_at)}</td>
      </tr>
    `).join('');

    // El catálogo ya viene ordenado de mayor a menor comisión desde el
    // backend (GET /api/organizaciones/catalogo-comisiones) — acá solo se
    // arma cada fila. El link de cada producto usa el mismo patrón
    // ?org=slug que el link general de arriba, pero apuntando a la ficha
    // puntual del producto en vez del catálogo completo.
    const filasCatalogo = (catalogo || []).map((p) => {
      const linkProducto = `${Huayca.BASE_URL}/producto.html?slug=${encodeURIComponent(p.slug)}&org=${encodeURIComponent(sesion?.slug || '')}`;
      return `
      <tr>
        <td>
          <div style="display:flex; align-items:center; gap:10px;">
            ${p.imagen_principal
              ? `<img src="${p.imagen_principal}" alt="${p.nombre}" style="width:40px;height:40px;border-radius:8px;object-fit:cover;flex-shrink:0;">`
              : `<div style="width:40px;height:40px;border-radius:8px;background:var(--bg);flex-shrink:0;"></div>`}
            <span>${p.nombre}</span>
          </div>
        </td>
        <td>${Huayca.formatoCLP(p.precio_final)}</td>
        <td><b style="color:var(--green-dark); font-size:15px;">${Huayca.formatoCLP(p.tu_comision)}</b></td>
        <td><button type="button" class="btn btn-sm btn-navy btn-copiar-producto" data-link="${linkProducto}">Copiar mi link</button></td>
      </tr>
    `;
    }).join('');

    // Dos pestañas, contenido ya armado antes (nada nuevo acá, solo se
    // reparte en dos bloques en vez de uno solo apilado) — cambiar de
    // pestaña es puro mostrar/ocultar vía JS (ver mostrarTab), no hay
    // recarga ni un segundo fetch: los datos de ambas pestañas ya están
    // acá desde el Promise.all de arriba.
    cont.innerHTML = `
      <div class="dash-tabs" id="dashTabs">
        <button type="button" class="dash-tab" id="tabBtnComisiones" onclick="mostrarTab('comisiones')">Mis comisiones</button>
        <button type="button" class="dash-tab" id="tabBtnProductos" onclick="mostrarTab('productos')">Productos y mis comisiones</button>
      </div>

      <div id="panelComisiones">
        <div class="stat-grid">
          <div class="stat-tile"><span>Saldo disponible</span><b>${Huayca.formatoCLP(data.saldo_disponible)}</b></div>
          <div class="stat-tile"><span>Total generado</span><b>${Huayca.formatoCLP(data.resumen.total_generado)}</b></div>
          <div class="stat-tile"><span>Total pagado</span><b>${Huayca.formatoCLP(data.resumen.total_pagado)}</b></div>
          <div class="stat-tile"><span>Ventas realizadas</span><b>${data.resumen.ventas_realizadas}</b></div>
        </div>

        <div class="link-share">
          <span style="font-size:20px;">🔗</span>
          <code id="linkCompartir">${link}</code>
          <button class="btn btn-sm btn-navy" id="btnCopiarLink">Copiar link</button>
        </div>

        <h3 style="color:var(--navy); font-size:16px; margin-bottom:10px;">Últimas comisiones</h3>
        ${filas ? `
          <div style="overflow-x:auto;">
            <table class="tabla-comisiones">
              <thead><tr><th>Pedido</th><th>Monto</th><th>Estado</th><th>Fecha</th></tr></thead>
              <tbody>${filas}</tbody>
            </table>
          </div>
        ` : '<div class="estado-vacio">Todavía no tienes ventas registradas. ¡Comparte tu link!</div>'}
      </div>

      <div id="panelProductos" class="hidden">
        <p style="color:var(--text-soft); font-size:13px; margin:0 0 14px;">Catálogo completo, ordenado por lo que más te conviene promocionar. Por privacidad, acá solo se muestra el precio final y tu comisión — el resto del desglose es interno de Huayca.</p>
        ${filasCatalogo ? `
          <div style="overflow-x:auto;">
            <table class="tabla-comisiones">
              <thead><tr><th>Producto</th><th>Precio final</th><th>Tu comisión</th><th></th></tr></thead>
              <tbody>${filasCatalogo}</tbody>
            </table>
          </div>
        ` : '<div class="estado-vacio">Todavía no hay productos activos en el catálogo.</div>'}
      </div>
    `;

    mostrarTab(tabActual);

    document.getElementById('btnCopiarLink').addEventListener('click', async () => {
      const btn = document.getElementById('btnCopiarLink');
      try {
        await navigator.clipboard.writeText(link);
        btn.textContent = '¡Copiado!';
        setTimeout(() => { btn.textContent = 'Copiar link'; }, 1800);
      } catch (e) {
        btn.textContent = 'No se pudo copiar';
      }
    });

    // Un solo listener delegado para todos los botones "Copiar mi link" de
    // la tabla de productos, en vez de uno por fila — más simple y sigue
    // funcionando igual si la tabla se vuelve a renderizar.
    cont.addEventListener('click', async (ev) => {
      const btn = ev.target.closest('.btn-copiar-producto');
      if (!btn) return;
      const textoOriginal = btn.textContent;
      try {
        await navigator.clipboard.writeText(btn.dataset.link);
        btn.textContent = '¡Copiado!';
        setTimeout(() => { btn.textContent = textoOriginal; }, 1800);
      } catch (e) {
        btn.textContent = 'No se pudo copiar';
        setTimeout(() => { btn.textContent = textoOriginal; }, 1800);
      }
    });
  } catch (err) {
    if (err.status === 401 || err.status === 403) { irALogin(); return; }
    cont.innerHTML = '<div class="estado-vacio">No se pudo cargar tu dashboard. Intenta de nuevo más tarde.</div>';
  }
}

// Cuál pestaña está activa se guarda acá afuera (no en el DOM) para que
// sobreviva a un cargarDashboard() nuevo — no debería hacer falta en el
// uso normal (se carga una sola vez), pero así "recordar la pestaña" no
// depende de en qué momento se llama esta función.
let tabActual = 'comisiones';
function mostrarTab(tab) {
  tabActual = tab;
  document.getElementById('tabBtnComisiones').classList.toggle('activo', tab === 'comisiones');
  document.getElementById('tabBtnProductos').classList.toggle('activo', tab === 'productos');
  document.getElementById('panelComisiones').classList.toggle('hidden', tab !== 'comisiones');
  document.getElementById('panelProductos').classList.toggle('hidden', tab !== 'productos');
}

document.getElementById('btnLogout').addEventListener('click', irALogin);
cargarDashboard();
</script>

</body>
</html>
