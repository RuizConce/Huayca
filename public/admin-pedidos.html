<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huayca — Pedidos</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', sans-serif; margin: 0; background: #f4f5f2; color: #1a1a1a; }
  header { background: #0d2b4e; color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; margin: 0; }
  header .der { display: flex; align-items: center; gap: 10px; }
  header a.volver { color: #ffffffcc; font-size: 13px; }
  header button { background: transparent; border: 1px solid #ffffff55; color: white; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .hidden { display: none !important; }

  .filtros-card { background: white; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .filtros-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; align-items: end; }
  .filtros-grid label { display: block; font-size: 11.5px; color: #888; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.02em; }
  .filtros-grid input, .filtros-grid select { width: 100%; padding: 8px 9px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  .filtros-acciones { display: flex; gap: 8px; margin-top: 12px; }
  .btn-primary { background: #e8801e; color: white; border: none; padding: 9px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-secondary { background: white; color: #0d2b4e; border: 1px solid #ccc; padding: 9px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; }

  .contador { font-size: 13px; color: #666; margin-bottom: 10px; }

  .tabla-card { background: white; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 900px; }
  th, td { text-align: left; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #f0efe9; white-space: nowrap; }
  th { color: #999; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.02em; }
  td.num { text-align: right; font-weight: 700; color: #0d2b4e; }
  td.producto { white-space: normal; max-width: 220px; }

  .estado-badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 10px; white-space: nowrap; }
  .estado-badge.pendiente { background: #fdf0e2; color: #e8801e; }
  .estado-badge.aprobado { background: #e7f5ec; color: #1e8e3e; }
  .estado-badge.rechazado { background: #fdeeee; color: #c0392b; }
  .estado-badge.reembolsado { background: #eef1f6; color: #556; }
  .estado-badge.preparando { background: #eef1fb; color: #3f51b5; }
  .estado-badge.enviado { background: #e7f5ec; color: #1e8e3e; }
  .estado-badge.entregado { background: #eef1f6; color: #556; }
  .estado-badge.no_aplica { background: #f4f5f2; color: #999; }

  .org-chip { background: #e7f5ec; color: #1e8e3e; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 8px; }
  .sin-org { color: #bbb; font-size: 12px; }

  .btn-marcar-pagado { background: #0d2b4e; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn-marcar-pagado:disabled { opacity: 0.6; cursor: not-allowed; }

  .estado-vacio { text-align: center; padding: 50px 20px; color: #999; font-size: 14px; }
  #estadoCarga { text-align: center; padding: 60px 20px; color: #888; }
  #errorBanner { background: #fdeeee; color: #c0392b; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #0d2b4e; color: white; padding: 12px 22px; border-radius: 24px;
    font-size: 13.5px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
  }
  #toast.visible { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  #toast.error { background: #c0392b; }
</style>
</head>
<body>

<header>
  <div>
    <a href="admin.html" class="volver">← Volver al panel</a>
    <h1 style="margin-top:4px;">🧾 Pedidos</h1>
  </div>
  <div class="der">
    <button onclick="cerrarSesion()">Cerrar sesión</button>
  </div>
</header>

<main>
  <div id="estadoCarga">Cargando pedidos…</div>

  <div id="app" class="hidden">
    <div id="errorBanner" class="hidden"></div>

    <div class="filtros-card">
      <div class="filtros-grid">
        <div>
          <label>Desde</label>
          <input type="date" id="fDesde">
        </div>
        <div>
          <label>Hasta</label>
          <input type="date" id="fHasta">
        </div>
        <div>
          <label>Estado de pago</label>
          <select id="fEstadoPago">
            <option value="">Todos</option>
            <option value="pendiente">Pendiente</option>
            <option value="aprobado">Aprobado</option>
            <option value="rechazado">Rechazado</option>
            <option value="reembolsado">Reembolsado</option>
          </select>
        </div>
        <div>
          <label>Estado de despacho</label>
          <select id="fEstadoDespacho">
            <option value="">Todos</option>
            <option value="pendiente">Pendiente</option>
            <option value="preparando">Preparando</option>
            <option value="enviado">Enviado</option>
            <option value="entregado">Entregado</option>
            <option value="no_aplica">No aplica</option>
          </select>
        </div>
        <div>
          <label>Organización</label>
          <select id="fOrganizacion"><option value="">Todas</option></select>
        </div>
        <div>
          <label>Proveedor</label>
          <select id="fProveedor"><option value="">Todos</option></select>
        </div>
        <div style="grid-column: span 2;">
          <label>Buscar (código, cliente, email)</label>
          <input type="text" id="fBusqueda" placeholder="HUY-000123, nombre o email…">
        </div>
      </div>
      <div class="filtros-acciones">
        <button class="btn-primary" onclick="cargar()">Filtrar</button>
        <button class="btn-secondary" onclick="limpiarFiltros()">Limpiar</button>
      </div>
    </div>

    <div class="contador" id="contadorTexto"></div>

    <div class="tabla-card">
      <table>
        <thead>
          <tr>
            <th>Fecha</th><th>Código</th><th>Cliente</th><th>Producto</th><th>Organización</th>
            <th>Proveedor</th><th style="text-align:right;">Total</th><th>Pago</th><th>Despacho</th><th></th>
          </tr>
        </thead>
        <tbody id="tablaPedidos"></tbody>
      </table>
      <div class="estado-vacio hidden" id="vacioPedidos">No hay pedidos que calcen con estos filtros.</div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
const BASE_URL = window.location.origin;
// Modo "embed": ver el comentario equivalente en admin-organizaciones.html.
const EMBED = new URLSearchParams(window.location.search).get('embed') === '1';
if (!EMBED) { window.location.replace('admin-panel.html?tab=pedidos'); }
if (EMBED) { const h = document.querySelector('header'); if (h) h.style.display = 'none'; }
function volverAlPanel() {
  if (EMBED) { parent.postMessage({ type: 'huayca-logout' }, '*'); return; }
  window.location.href = 'admin.html';
}
const token = localStorage.getItem('huayca_admin_token') || '';
if (!token) volverAlPanel();

function cerrarSesion() {
  localStorage.removeItem('huayca_admin_token');
  volverAlPanel();
}

function authHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
}

async function apiFetch(path, options = {}) {
  const res = await fetch(BASE_URL + path, { ...options, headers: { ...authHeaders(), ...(options.headers || {}) } });
  if (res.status === 401 || res.status === 403) {
    cerrarSesion();
    throw new Error('Sesión expirada, inicia sesión de nuevo');
  }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Error en la petición');
  return data;
}

function mostrarError(msg) {
  const banner = document.getElementById('errorBanner');
  banner.textContent = msg;
  banner.classList.remove('hidden');
  setTimeout(() => banner.classList.add('hidden'), 5000);
}

let toastTimeoutId = null;
function mostrarToast(msg, esError) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.toggle('error', !!esError);
  toast.classList.add('visible');
  if (toastTimeoutId) clearTimeout(toastTimeoutId);
  toastTimeoutId = setTimeout(() => toast.classList.remove('visible'), 3000);
}

function formatoFecha(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('es-CL', { day: '2-digit', month: 'short', year: 'numeric' });
}

const ESTADO_PAGO_LABEL = { pendiente: 'Pendiente', aprobado: 'Aprobado', rechazado: 'Rechazado', reembolsado: 'Reembolsado' };
const ESTADO_DESPACHO_LABEL = { pendiente: 'Pendiente', preparando: 'Preparando', enviado: 'Enviado', entregado: 'Entregado', no_aplica: 'No aplica' };

// ---------- Filtros (poblar selects de organización/proveedor una sola vez) ----------
async function poblarSelectsFiltro() {
  try {
    const [orgs, provs] = await Promise.all([
      apiFetch('/api/admin/organizaciones?estado=aprobada'),
      apiFetch('/api/admin/proveedores')
    ]);
    const selOrg = document.getElementById('fOrganizacion');
    (Array.isArray(orgs) ? orgs : []).forEach((o) => {
      selOrg.insertAdjacentHTML('beforeend', `<option value="${o.id}">${o.nombre}</option>`);
    });
    const selProv = document.getElementById('fProveedor');
    (Array.isArray(provs) ? provs : []).forEach((p) => {
      selProv.insertAdjacentHTML('beforeend', `<option value="${p.id}">${p.nombre}</option>`);
    });
  } catch (e) {
    // Los selects quedan con solo "Todas/Todos" — no bloquea el resto del filtro.
  }
}

function limpiarFiltros() {
  document.getElementById('fDesde').value = '';
  document.getElementById('fHasta').value = '';
  document.getElementById('fEstadoPago').value = '';
  document.getElementById('fEstadoDespacho').value = '';
  document.getElementById('fOrganizacion').value = '';
  document.getElementById('fProveedor').value = '';
  document.getElementById('fBusqueda').value = '';
  cargar();
}

function armarQuery() {
  const params = new URLSearchParams();
  const desde = document.getElementById('fDesde').value;
  const hasta = document.getElementById('fHasta').value;
  // Un <input type="date"> solo entrega el día (YYYY-MM-DD) — "hasta" se
  // extiende al final de ese día (23:59:59) para no dejar afuera los
  // pedidos del último día elegido.
  if (desde) params.set('desde', new Date(desde + 'T00:00:00').toISOString());
  if (hasta) params.set('hasta', new Date(hasta + 'T23:59:59').toISOString());
  const estadoPago = document.getElementById('fEstadoPago').value;
  const estadoDespacho = document.getElementById('fEstadoDespacho').value;
  const organizacionId = document.getElementById('fOrganizacion').value;
  const proveedorId = document.getElementById('fProveedor').value;
  const q = document.getElementById('fBusqueda').value.trim();
  if (estadoPago) params.set('estado_pago', estadoPago);
  if (estadoDespacho) params.set('estado_despacho', estadoDespacho);
  if (organizacionId) params.set('organizacion_id', organizacionId);
  if (proveedorId) params.set('proveedor_id', proveedorId);
  if (q) params.set('q', q);
  return params.toString();
}

async function cargar() {
  try {
    const data = await apiFetch('/api/admin/pedidos?' + armarQuery());
    render(Array.isArray(data) ? data : []);
    document.getElementById('estadoCarga').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
  } catch (e) {
    document.getElementById('estadoCarga').textContent = 'Error al cargar: ' + e.message;
  }
}

function render(pedidos) {
  document.getElementById('contadorTexto').textContent =
    `${pedidos.length} pedido${pedidos.length === 1 ? '' : 's'}` + (pedidos.length === 300 ? ' (mostrando los 300 más recientes del filtro — acotá el rango de fechas para ver el resto)' : '');

  const tbody = document.getElementById('tablaPedidos');
  if (!pedidos.length) {
    tbody.innerHTML = '';
    document.getElementById('vacioPedidos').classList.remove('hidden');
    return;
  }
  document.getElementById('vacioPedidos').classList.add('hidden');

  tbody.innerHTML = pedidos.map((p) => `
    <tr id="fila_${p.id}">
      <td>${formatoFecha(p.created_at)}</td>
      <td><b>${p.codigo}</b></td>
      <td>${p.cliente_nombre}</td>
      <td class="producto">${p.producto_nombre} × ${p.cantidad}</td>
      <td>${p.organizacion_nombre ? `<span class="org-chip">${p.organizacion_nombre}</span>` : '<span class="sin-org">Venta directa</span>'}</td>
      <td>${p.proveedor_nombre}</td>
      <td class="num">$${Number(p.monto_total).toLocaleString('es-CL')}</td>
      <td><span class="estado-badge ${p.estado_pago}">${ESTADO_PAGO_LABEL[p.estado_pago] || p.estado_pago}</span></td>
      <td><span class="estado-badge ${p.estado_despacho}">${ESTADO_DESPACHO_LABEL[p.estado_despacho] || p.estado_despacho}</span></td>
      <td>${p.estado_pago === 'pendiente'
        ? `<button class="btn-marcar-pagado" onclick="marcarPagado(${p.id})">Marcar pagado</button>`
        : ''}</td>
    </tr>
  `).join('');
}

// Confirmación manual de pago (ej. transferencia directa) — reusa el mismo
// endpoint que ya usa admin-sincronizar-pago.html / el flujo de Mercado
// Pago, así que activa las comisiones exactamente igual.
async function marcarPagado(pedidoId) {
  const fila = document.getElementById('fila_' + pedidoId);
  const boton = fila ? fila.querySelector('.btn-marcar-pagado') : null;
  if (boton) boton.disabled = true;
  try {
    const r = await apiFetch(`/api/admin/pedidos/${pedidoId}/marcar-pagado`, { method: 'PATCH' });
    mostrarToast(r.mensaje || 'Pedido marcado como pagado ✓');
    cargar();
  } catch (e) {
    mostrarToast(e.message, true);
    if (boton) boton.disabled = false;
  }
}

poblarSelectsFiltro();
cargar();
</script>

</body>
</html>
